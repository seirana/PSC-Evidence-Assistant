[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psc-evidence-assistant"
version = "0.1.0"
description = "Evidence-grounded RAG assistant for PSC documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.2,<4",
  "pydantic>=2.6,<3",
  "pypdf>=4,<6",
  "python-docx>=1.1,<2",
  "scikit-learn>=1.4,<2",
  "streamlit>=1.32,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
  ".git",
  ".venv",
  "outputs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
